body{margin:0;background:#2e3f78;color:#fff;font-family:Arial,sans-serif;overflow:hidden;touch-action:none}
canvas{display:block;width:100vw;height:100dvh;touch-action:none}

#hp{color:#ff5a5a;letter-spacing:3px;font-size:22px}

.panel{max-width:360px;width:100%}
.logo{font-size:84px;font-weight:1000;letter-spacing:-3px;color:#f5a83b;-webkit-text-stroke:5px #1b1410;paint-order:stroke fill;text-shadow:0 7px 0 #1b1410;transform:rotate(-3deg)}
.studio{font-size:11px;letter-spacing:4px;color:#c9d2ff;margin-top:6px}
.description{font-size:13px;line-height:1.75;color:#dfe4ff;margin-top:22px}
.best{margin-top:14px;font-weight:900;color:#ffd37a;font-size:13px;letter-spacing:2px}

button:active{transform:translateY(4px);box-shadow:0 1px 0 #1b1410}
#hud{display:none}#skip{position:fixed;top:56px;right:16px;z-index:5;padding:8px 14px;font-size:12px;margin:0;box-shadow:none;display:none}
.modes{display:grid;gap:8px;margin-top:16px}.modes button{margin:0;padding:12px;font-size:15px;box-shadow:0 4px 0 #1b1410}.modes small{display:block;font-size:10px;font-weight:700;opacity:.7;margin-top:2px}
#overlay{overflow:auto}.panel{margin:auto}
.chs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.ch{background:#ffffff14;border:2px solid #ffffff30;border-radius:10px;padding:7px 2px;font-size:10px;font-weight:900}
.ch.on{border-color:#f5a83b;background:#f5a83b30}
.ch i{display:block;width:20px;height:20px;border-radius:6px;margin:0 auto 4px;border:2px solid #1b1410}
.ch small{display:block;font-size:8px;font-weight:700;opacity:.7;margin-top:2px}
.lg{animation:pop .6s cubic-bezier(.3,1.6,.5,1)}.lg svg{filter:drop-shadow(0 6px 0 #1b1410);max-width:100%}
@keyframes pop{0%{transform:scale(2.2);opacity:0}100%{transform:scale(1);opacity:1}}
.gear{transform-box:fill-box;transform-origin:center;animation:sp 6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#splash{position:fixed;inset:0;z-index:9;background:#140f1c;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;animation:out .4s 1.4s forwards}
.sg{font-size:80px;color:#f5a83b;animation:spin 1.2s ease-out}
.sn{font-size:12px;letter-spacing:5px;color:#c9d2ff;margin-top:14px;animation:fi 1s .3s both}
@keyframes spin{from{transform:rotate(-360deg) scale(.2);opacity:0}to{transform:none;opacity:1}}
@keyframes fi{from{opacity:0;transform:translateY(8px)}}
@keyframes out{to{opacity:0;visibility:hidden}}
.btn{display:none}body.pl .btn{display:flex}
.chs2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 4px}
.ch2{background:#ffffff14;border:3px solid #ffffff30;border-radius:14px;padding:14px 4px 8px;font-weight:900;font-size:13px}.ch2.on{border-color:#f5a83b;background:#f5a83b30}.ch2 small{display:block;font-size:10px;opacity:.75;margin-top:3px}
.rb{position:relative;width:70px;height:84px;margin:0 auto 8px}.rb span{position:absolute;border:3px solid #1b1410}
.an{left:10px;top:-4px;width:12px;height:12px;border-radius:50%}.hd{left:8px;top:6px;width:54px;height:34px;border-radius:16px}
.hd u{position:absolute;left:12px;top:6px;width:26px;height:14px;background:#fff;border:2px solid #1b1410;border-radius:8px}
.bd{left:16px;top:38px;width:38px;height:28px;border-radius:10px}.bd s{position:absolute;left:8px;top:5px;width:14px;height:12px;border-radius:4px;border:2px solid #1b1410}
.ft{top:64px;width:20px;height:12px;border-radius:5px}
.ch2.on .rb{animation:fl .9s ease-in-out infinite alternate}@keyframes fl{to{transform:translateY(-6px)}}
</style>
